name: report-service

# Nilai bersama untuk api dan worker. Keduanya memakai image yang sama, hanya
# perintah jalannya yang berbeda.
x-app: &app
  build: .
  image: report-service:local
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    GOTENBERG_URL: http://gotenberg:3000
    STORAGE_DIR: /app/storage
  volumes:
    - report-storage:/app/storage
  # Batasi ukuran log supaya disk tidak penuh setelah service lama berjalan.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    redis:
      condition: service_healthy
    gotenberg:
      condition: service_healthy

services:
  api:
    <<: *app
    container_name: report-api
    command: ["bun", "run", "src/index.ts"]
    ports:
      - "${PORT:-5006}:${PORT:-5006}"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:' + (process.env.PORT || 5006) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    container_name: report-worker
    command: ["bun", "run", "src/worker.ts"]
    # Worker tidak punya port HTTP, jadi yang diperiksa adalah hal yang paling
    # menentukan hidupnya: koneksi ke Redis. Kalau Redis tidak terjangkau,
    # worker tidak bisa mengambil job dan dianggap tidak sehat.
    healthcheck:
      test: ["CMD", "bun", "-e", "const s = await Bun.connect({ hostname: process.env.REDIS_HOST, port: Number(process.env.REDIS_PORT), socket: { data() {}, open() {}, error() {} } }); s.end()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7
    container_name: report-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    # Dipublish ke host supaya `bun run dev` di mesin ini memakai Redis yang sama
    # dengan api/worker di container - bukan antrean kedua yang terpisah.
    # Hanya 127.0.0.1, jadi tidak terbuka ke jaringan.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: report-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --chromium-disable-javascript=true
    # Sama seperti redis: untuk `bun run dev` di host. Hanya 127.0.0.1,
    # jadi tidak terbuka ke jaringan.
    ports:
      - "127.0.0.1:3100:3000"
    # Tanpa healthcheck, api dan worker mulai begitu container Gotenberg
    # menyala - padahal Chromium di dalamnya belum siap menerima render.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  report-storage:
  redis-data:
